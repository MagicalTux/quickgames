<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Quick Games</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;800&display=swap">
<style>
/* Layout: a single narrow column of game cards, toy-box palette shared with the games. */
:root{
  --bg:#c9cdf0;
  --ink:#2b2f55;
  --muted:#565b86;
  --card:#ffffff;
  --edge:rgba(43,47,85,.18);
  --go:#5cc93a;
  --display:"Lilita One","Arial Rounded MT Bold",system-ui,sans-serif;
  --body:"Nunito",system-ui,-apple-system,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{--bg:#1d2040;--ink:#eef0ff;--muted:#b3b7e0;--card:#2a2e57;--edge:rgba(0,0,0,.35);color-scheme:dark}}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);padding:48px 16px}
main{max-width:520px;margin:0 auto;display:grid;gap:24px}
h1{font-family:var(--display);font-weight:400;font-size:44px;margin:0;line-height:1}
p{margin:0;color:var(--muted);font-weight:600;line-height:1.45}
ul{list-style:none;margin:0;padding:0;display:grid;gap:14px}
a.game{display:flex;gap:16px;align-items:center;background:var(--card);color:inherit;text-decoration:none;border-radius:18px;padding:16px;box-shadow:0 6px 0 var(--edge)}
a.game:hover{transform:translateY(-2px)}
a.game:focus-visible{outline:3px solid var(--go);outline-offset:3px}
.icon{flex:none;width:56px;height:56px;border-radius:14px;background:#46528c;display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:8px;box-sizing:border-box}
.icon i{border-radius:50%}
.name{font-family:var(--display);font-size:24px}
.desc{font-size:14px;margin-top:2px;color:var(--muted)}
@media (prefers-reduced-motion: reduce){a.game:hover{transform:none}}
</style>
</head>
<body>
<main>
  <header>
    <h1>Quick Games</h1>
    <p>Small browser games. Each one plays on a phone, no install needed.</p>
  </header>
  <ul>
    <li>
      <a class="game" href="colorballs/">
        <span class="icon" aria-hidden="true">
          <i style="background:#4fd8ee"></i><i style="background:#e64fd3"></i><i style="background:#ffcd2b"></i>
          <i style="background:#ff8b33"></i><i style="background:#4fd8ee"></i><i style="background:#8a68ff"></i>
          <i style="background:#ffcd2b"></i><i style="background:#ff4d61"></i><i style="background:#e64fd3"></i>
        </span>
        <span>
          <span class="name">Colorballs</span>
          <span class="desc" style="display:block">Pour pipes of colored balls onto a conveyor and drop each one into its matching tray.</span>
        </span>
      </a>
    </li>
  </ul>
</main>
</body>
</html>
