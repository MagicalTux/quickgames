<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#c9cdf0">
<title>Colorballs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;800&display=swap">
<style>
/* Layout: one fixed stage, a 400x820 canvas scaled to fit, HTML cards for win/lose. Single bright toy-room look (no dark variant, by choice). */
:root{
  --bg:#c9cdf0;
  --ink:#2b2f55;
  --card:#ffffff;
  --go:#5cc93a;
  --go-deep:#3f9a24;
  --scrim:rgba(43,47,85,.5);
  --display:"Lilita One","Arial Rounded MT Bold",system-ui,sans-serif;
  --body:"Nunito",system-ui,-apple-system,sans-serif;
  color-scheme:light;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:var(--bg);overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-text-size-adjust:100%}
#stage{position:fixed;top:env(safe-area-inset-top,0px);bottom:env(safe-area-inset-bottom,0px);left:0;right:0;display:flex;align-items:center;justify-content:center}
canvas{display:block;touch-action:none;-webkit-tap-highlight-color:transparent;cursor:pointer}
#ov{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--scrim);padding:0 16px}
.card{background:var(--card);color:var(--ink);border-radius:22px;padding:28px 26px 24px;text-align:center;max-width:320px;width:100%;box-shadow:0 10px 0 rgba(43,47,85,.25)}
.card h1{font-family:var(--display);font-weight:400;font-size:40px;line-height:1.05;margin:0 0 8px;text-wrap:balance}
.card p{font-family:var(--body);font-weight:600;font-size:16px;margin:0 0 22px;line-height:1.45}
.card button{font-family:var(--display);font-size:22px;letter-spacing:.02em;color:#fff;background:var(--go);border:0;border-radius:14px;padding:12px 30px;box-shadow:0 5px 0 var(--go-deep);cursor:pointer}
.card button:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.card button:active{transform:translateY(3px);box-shadow:0 2px 0 var(--go-deep)}
</style>
</head>
<body>
<div id="stage"><canvas id="cv" aria-label="Colorballs game board. Keys 1, 2, 3 tap the pipes, R restarts."></canvas></div>
<div id="ov" hidden><div class="card"><h1 id="ovT"></h1><p id="ovP"></p><button id="ovB" type="button"></button></div></div>

<script>
(() => {
const W = 400, H = 820;
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- colors & sprites ---------- */
const PALETTE = {cyan:'#4fd8ee', pink:'#e64fd3', yellow:'#ffcd2b', orange:'#ff8b33', purple:'#8a68ff', red:'#ff4d61',
  blue:'#3d6ef5', white:'#eceef6', brown:'#9b6a43', teal:'#14a88a'};
const NAMES = Object.keys(PALETTE);
function shade(hex, a) {
  const n = parseInt(hex.slice(1), 16);
  let r = n >> 16, g = n >> 8 & 255, b = n & 255;
  const f = a < 0 ? 0 : 255, t = Math.abs(a);
  r = Math.round(r + (f - r) * t); g = Math.round(g + (f - g) * t); b = Math.round(b + (f - b) * t);
  return `rgb(${r},${g},${b})`;
}
const R = 9;
const sprites = {};
for (const k of NAMES) {
  const c = document.createElement('canvas'), s = 4, sz = 2 * R + 2;
  c.width = c.height = sz * s;
  const g = c.getContext('2d'); g.scale(s, s);
  const m = sz / 2;
  const grd = g.createRadialGradient(m - R * .35, m - R * .4, R * .1, m, m, R);
  grd.addColorStop(0, shade(PALETTE[k], .65));
  grd.addColorStop(.35, PALETTE[k]);
  grd.addColorStop(1, shade(PALETTE[k], -.32));
  g.fillStyle = grd; g.beginPath(); g.arc(m, m, R, 0, Math.PI * 2); g.fill();
  sprites[k] = c;
}
function drawBall(c, x, y, sc = 1) { const r = (R + 1) * sc; ctx.drawImage(sprites[c], x - r, y - r, 2 * r, 2 * r); }

/* ---------- geometry ---------- */
const BELT = {x1: 62, x2: 338, top: 490, r: 34};
const BL = BELT.x2 - BELT.x1;
const PER = 2 * BL + 2 * Math.PI * BELT.r;
const N = Math.round(PER / 22), SP = PER / N;
function beltPoint(s) {
  s = ((s % PER) + PER) % PER;
  const r = BELT.r, cy = BELT.top + r;
  if (s < BL) return {x: BELT.x1 + s, y: BELT.top};
  s -= BL;
  if (s < Math.PI * r) { const a = -Math.PI / 2 + s / r; return {x: BELT.x2 + r * Math.cos(a), y: cy + r * Math.sin(a)}; }
  s -= Math.PI * r;
  if (s < BL) return {x: BELT.x2 - s, y: BELT.top + 2 * r};
  s -= BL;
  const a = Math.PI / 2 + s / r; return {x: BELT.x1 + r * Math.cos(a), y: cy + r * Math.sin(a)};
}
const entryK = Math.round((W / 2 - BELT.x1) / SP);
const OUT_X = BELT.x1 + entryK * SP;
const CH = 22;
const COLX = [83, 161, 239, 317];
const pickK = COLX.map(cx => Math.round((BL + Math.PI * BELT.r + (BELT.x2 - cx)) / SP) % N);
const TRAY_TOP = 590, TH = 38, CAP = 3;
const PIPE_X = [80, 200, 320], PACK_Y = 182, PACK_HIDDEN = 110, GATE_Y = 284;
const WALLS = [
  [8, 200, 8, 396], [392, 200, 392, 396],
  [8, 396, OUT_X - CH, 450], [OUT_X + CH, 450, 392, 396],
  [OUT_X - CH, 450, OUT_X - CH, 468], [OUT_X + CH, 450, OUT_X + CH, 468],
  [OUT_X - CH, 468, OUT_X + CH, 468],
];

/* ---------- timing (ms) ---------- */
const TICK = 100, DROP = 260, EMERGE = 220, ENTER = 120, FLY = 160, CLEAR = 260, SHIFT = 200;

/* ---------- state ---------- */
let level = 1, pipes, cols, slots, step, lastTick, T, sink, emitters, flyers, parts, state, hintOn, endT;

function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; }

function genLevel(n) {
  const nc = Math.min(3 + Math.floor((n - 1) / 2), NAMES.length);
  const colors = shuffle(NAMES.slice()).slice(0, nc);
  const per = Math.min(1 + n, 9);
  const ps = PIPE_X.map(x => {
    const r = Math.random();
    const mult = n === 1 ? 3 : r < .7 ? 3 : r < .9 ? 2 : 1;
    return {x, mult, queue: [], anim: null, emergeT0: -1e9, shakeT0: -1e9, flashT0: -1e9};
  });
  const all = [];
  for (let i = 0; i < per * 3; i++) all.push(colors[i % nc]);
  shuffle(all);
  ps.forEach((p, i) => p.queue = all.slice(i * per, (i + 1) * per));
  // Stack every tray up front, following one hidden tap order. A layout is kept only
  // if pouring in that order lets every ball find a tray, whichever matching tray it
  // happens to reach first.
  const packs = [], idx = [0, 0, 0];
  while (idx.some(i => i < per)) {
    const avail = [0, 1, 2].filter(i => idx[i] < per);
    const i = avail[Math.random() * avail.length | 0];
    packs.push({c: ps[i].queue[idx[i]++], trays: ps[i].mult * 3});
  }
  let stacks = null;
  for (let attempt = 0; attempt < 400 && !stacks; attempt++) {
    const st = [[], [], [], []];
    for (const pk of packs) for (let t = 0; t < pk.trays; t++) st[Math.random() * 4 | 0].push(pk.c);
    if (solvable(st, packs)) stacks = st;
  }
  if (!stacks) return null;
  const cs = stacks.map(st => ({trays: st.map(c => ({c, res: 0, fill: 0})), clearT0: null, shiftT0: -1e9}));
  return {pipes: ps, cols: cs};
}

function solvable(stacks, packs) {
  for (let trial = 0; trial < 8; trial++) {
    const ptr = [0, 0, 0, 0], fill = [0, 0, 0, 0];
    for (const pk of packs) {
      for (let n = pk.trays * CAP; n > 0; n--) {
        const open = [0, 1, 2, 3].filter(j => stacks[j][ptr[j]] === pk.c);
        if (!open.length) return false;
        const j = open[Math.random() * open.length | 0];
        if (++fill[j] === CAP) { fill[j] = 0; ptr[j]++; }
      }
    }
  }
  return true;
}

function startLevel(n) {
  level = n;
  let g;
  do g = genLevel(n); while (!g);
  pipes = g.pipes; cols = g.cols;
  slots = new Array(N).fill(null);
  step = 0; T = 0; lastTick = 0;
  sink = []; emitters = []; flyers = []; parts = [];
  state = 'play'; endT = 0; hintOn = n === 1;
  speed = 1;
  ov.hidden = true;
  try { localStorage.setItem('colorballs.level', String(n)); } catch (e) {}
}

/* ---------- overlay ---------- */
const ov = document.getElementById('ov'), ovT = document.getElementById('ovT'), ovP = document.getElementById('ovP'), ovB = document.getElementById('ovB');
let ovAction = null;
function showOverlay(t, p, b, fn) { ovT.textContent = t; ovP.textContent = p; ovB.textContent = b; ovAction = fn; ov.hidden = false; ovB.focus(); }
ovB.addEventListener('click', () => ovAction && ovAction());

function lose() {
  state = 'over';
  setTimeout(() => showOverlay('Belt jammed', 'The belt is full and no open tray takes any of its colors.', 'Try again', () => startLevel(level)), 700);
}
function win() {
  state = 'won';
  setTimeout(() => showOverlay(`Level ${level} cleared`, 'Every pipe is empty and every ball found its tray.', 'Next level', () => startLevel(level + 1)), 500);
}

/* ---------- input ---------- */
function tapPipe(p) {
  if (state !== 'play') return;
  if (!p.queue.length || p.anim) { p.shakeT0 = T; return; }
  hintOn = false;
  p.anim = {c: p.queue.shift(), t0: T};
  p.emergeT0 = T + DROP;
}
cv.addEventListener('pointerdown', e => {
  const r = cv.getBoundingClientRect();
  const x = (e.clientX - r.left) / r.width * W, y = (e.clientY - r.top) / r.height * H;
  if (Math.hypot(x - 374, y - 24) < 22) { startLevel(level); return; }
  if (y > 40 && y < 260) for (const p of pipes) if (Math.abs(x - p.x) < 52) { tapPipe(p); return; }
});
addEventListener('keydown', e => {
  if (!ov.hidden) return;
  if (e.key >= '1' && e.key <= '3') tapPipe(pipes[+e.key - 1]);
  else if (e.key === 'r' || e.key === 'R') startLevel(level);
});

/* ---------- physics (sink) ---------- */
const G = 1500;
function collideWall(b, w) {
  const [x1, y1, x2, y2] = w, ex = x2 - x1, ey = y2 - y1;
  let t = ((b.x - x1) * ex + (b.y - y1) * ey) / (ex * ex + ey * ey);
  t = t < 0 ? 0 : t > 1 ? 1 : t;
  const px = x1 + ex * t, py = y1 + ey * t;
  let dx = b.x - px, dy = b.y - py;
  const d2 = dx * dx + dy * dy;
  if (d2 >= R * R) return;
  let d = Math.sqrt(d2);
  if (d < 1e-6) { dx = 0; dy = -1; d = 1; }
  const nx = dx / d, ny = dy / d;
  b.x = px + nx * R; b.y = py + ny * R;
  const vn = b.vx * nx + b.vy * ny;
  if (vn < 0) { b.vx -= 1.2 * vn * nx; b.vy -= 1.2 * vn * ny; }
}
function physics(dt) {
  const sub = 4, h = dt / sub, D = 2 * R, D2 = D * D;
  for (let s = 0; s < sub; s++) {
    for (const b of sink) { b.vy += G * h; b.x += b.vx * h; b.y += b.vy * h; }
    for (let i = 0; i < sink.length; i++) {
      const a = sink[i];
      for (let j = i + 1; j < sink.length; j++) {
        const b = sink[j];
        const dx = b.x - a.x; if (dx > D || dx < -D) continue;
        const dy = b.y - a.y; if (dy > D || dy < -D) continue;
        const d2 = dx * dx + dy * dy;
        if (d2 >= D2 || d2 === 0) continue;
        const d = Math.sqrt(d2), nx = dx / d, ny = dy / d, o = (D - d) * .5;
        a.x -= nx * o; a.y -= ny * o; b.x += nx * o; b.y += ny * o;
        const vn = (b.vx - a.vx) * nx + (b.vy - a.vy) * ny;
        if (vn < 0) { const im = -vn * .55; a.vx -= nx * im; a.vy -= ny * im; b.vx += nx * im; b.vy += ny * im; }
      }
    }
    for (const b of sink) for (const w of WALLS) collideWall(b, w);
  }
  for (const b of sink) {
    b.vx *= .996; b.vy *= .996;
    if (b.y > 480 || b.x < 0 || b.x > W) { b.x = OUT_X; b.y = 440; b.vx = b.vy = 0; }
  }
}
function sinkCandidate() {
  let best = -1, by = 452;
  for (let i = 0; i < sink.length; i++) { const b = sink[i]; if (Math.abs(b.x - OUT_X) < CH && b.y > by) { by = b.y; best = i; } }
  return best;
}

/* ---------- belt ---------- */
const slotAt = k => ((k - step) % N + N) % N;
const colBusy = c => c.clearT0 !== null || T - c.shiftT0 < SHIFT;
function tick() {
  step++;
  cols.forEach((col, j) => {
    const tr = col.trays[0];
    if (!tr || colBusy(col) || tr.res >= CAP) return;
    const i = slotAt(pickK[j]), b = slots[i];
    if (b && b.c === tr.c) {
      slots[i] = null;
      const p = beltPoint(pickK[j] * SP);
      flyers.push({c: b.c, x: p.x, y: p.y, tr, col: j, hole: tr.res, t0: T});
      tr.res++;
    }
  });
  const ei = slotAt(entryK);
  if (!slots[ei]) {
    const ci = sinkCandidate();
    if (ci >= 0) { const b = sink.splice(ci, 1)[0]; slots[ei] = {c: b.c, fx: b.x, fy: b.y, t0: T}; }
  }
  if (slots.every(Boolean) && !flyers.length && !cols.some(colBusy)) {
    const can = cols.some(c => { const t = c.trays[0]; return t && t.res < CAP && slots.some(s => s.c === t.c); });
    if (!can) lose();
  }
}

/* ---------- update ---------- */
function burst(x, y, c) {
  if (reduced) return;
  for (let i = 0; i < 14; i++) {
    const a = Math.random() * Math.PI * 2, v = 80 + Math.random() * 160;
    parts.push({x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 120, c, t0: T});
  }
}
function update(dt) {
  T += dt * 1000;
  for (const p of pipes) {
    if (p.anim && T - p.anim.t0 >= DROP) {
      emitters.push({x: p.x, c: p.anim.c, left: 9 * p.mult, next: T});
      p.flashT0 = T; p.anim = null;
    }
  }
  for (let i = emitters.length - 1; i >= 0; i--) {
    const e = emitters[i];
    while (e.left > 0 && T >= e.next) {
      const row = Math.min(6, e.left);
      for (let k = 0; k < row; k++) {
        sink.push({x: e.x + (k - (row - 1) / 2) * 19 + (Math.random() - .5) * 2, y: GATE_Y + 20 + Math.random() * 2, vx: (Math.random() - .5) * 40, vy: 220, c: e.c});
      }
      e.left -= row; e.next += 55;
    }
    if (!e.left) emitters.splice(i, 1);
  }
  physics(dt);
  while (T - lastTick >= TICK && state === 'play') { lastTick += TICK; tick(); }
  for (let i = flyers.length - 1; i >= 0; i--) {
    const f = flyers[i];
    if (T - f.t0 >= FLY) {
      flyers.splice(i, 1);
      f.tr.fill++;
      if (f.tr.fill >= CAP) { cols[f.col].clearT0 = T; burst(COLX[f.col], TRAY_TOP + 16, f.tr.c); }
    }
  }
  for (const col of cols) if (col.clearT0 !== null && T - col.clearT0 >= CLEAR) { col.trays.shift(); col.clearT0 = null; col.shiftT0 = T; }
  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i];
    p.vy += 600 * dt; p.x += p.vx * dt; p.y += p.vy * dt;
    if (T - p.t0 > 650) parts.splice(i, 1);
  }
  if (state === 'play' && pipes.every(p => !p.queue.length && !p.anim) && !emitters.length && !sink.length &&
      !flyers.length && slots.every(s => !s) && !cols.some(colBusy)) win();
}

/* ---------- drawing ---------- */
function rr(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
const easeOut = t => 1 - (1 - t) * (1 - t);
function outlinedText(txt, x, y, size, fill, stroke) {
  ctx.font = `${size}px "Lilita One", "Arial Rounded MT Bold", system-ui, sans-serif`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.lineJoin = 'round'; ctx.lineWidth = size * .2; ctx.strokeStyle = stroke; ctx.strokeText(txt, x, y);
  ctx.fillStyle = fill; ctx.fillText(txt, x, y);
}
function drawPack(x, y, c, alpha = 1) {
  ctx.globalAlpha = alpha;
  rr(x - 25, y, 50, 50, 10); ctx.fillStyle = shade(PALETTE[c], -.22); ctx.fill();
  rr(x - 25, y, 50, 46, 10); ctx.fillStyle = PALETTE[c]; ctx.fill();
  for (let i = 0; i < 3; i++) for (let j = 0; j < 3; j++) {
    const bx = x - 14 + i * 14, by = y + 9 + j * 14;
    ctx.fillStyle = shade(PALETTE[c], .28); ctx.beginPath(); ctx.arc(bx, by, 5.5, 0, 7); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.75)'; ctx.beginPath(); ctx.arc(bx - 1.5, by - 1.8, 1.4, 0, 7); ctx.fill();
  }
  ctx.globalAlpha = 1;
}
function pipeGrad(x, empty) {
  const g = ctx.createLinearGradient(x - 44, 0, x + 44, 0);
  if (empty) { g.addColorStop(0, '#9aa0b8'); g.addColorStop(.32, '#cfd3e3'); g.addColorStop(1, '#8f95ad'); }
  else { g.addColorStop(0, '#46a628'); g.addColorStop(.32, '#93e663'); g.addColorStop(1, '#3f9a24'); }
  return g;
}
function drawPipe(p) {
  const st = T - p.shakeT0;
  const x = p.x + (st < 300 && !reduced ? Math.sin(st / 18) * 4 * (1 - st / 300) : 0);
  const empty = !p.queue.length && !p.anim;
  if (p.queue.length) {
    const e = Math.max(0, Math.min(1, (T - p.emergeT0) / EMERGE));
    drawPack(x, PACK_HIDDEN + (PACK_Y - PACK_HIDDEN) * easeOut(e), p.queue[0]);
  }
  if (p.anim) {
    const t = Math.min(1, (T - p.anim.t0) / DROP);
    drawPack(x, PACK_Y + (GATE_Y - 30 - PACK_Y) * t * t, p.anim.c, 1 - t * .4);
  }
  ctx.fillStyle = pipeGrad(x, empty); ctx.fillRect(x - 34, 40, 68, 112);
  rr(x - 44, 146, 88, 32, 10); ctx.fillStyle = empty ? '#7f859d' : '#3a8f20'; ctx.fill();
  rr(x - 44, 144, 88, 28, 10); ctx.fillStyle = pipeGrad(x, empty); ctx.fill();
  for (let k = 1; k <= Math.min(3, p.queue.length - 1); k++) {
    const y = 98 - k * 18, c = PALETTE[p.queue[k]];
    ctx.globalAlpha = 1 - (k - 1) * .2;
    rr(x - 13, y, 26, 14, 4); ctx.fillStyle = shade(c, -.3); ctx.fill();
    rr(x - 13, y, 26, 12, 4); ctx.fillStyle = c; ctx.fill();
    ctx.globalAlpha = 1;
  }
  outlinedText(String(p.queue.length), x, 120, 30, '#ffffff', empty ? '#5c6178' : '#1f4a12');
}
function drawGate(p) {
  if (p.mult <= 1) return;
  const x = p.x, fl = Math.max(0, 1 - (T - p.flashT0) / 220);
  rr(x - 52, GATE_Y - 12, 104, 26, 6); ctx.fillStyle = '#5aa63a'; ctx.fill();
  rr(x - 52, GATE_Y - 14, 104, 24, 6);
  const g = ctx.createLinearGradient(0, GATE_Y - 14, 0, GATE_Y + 10);
  g.addColorStop(0, fl ? '#f4ffe9' : '#c9f0a8'); g.addColorStop(1, fl ? '#d6f9b8' : '#8ccf62');
  ctx.fillStyle = g; ctx.fill();
  for (const ex of [x - 56, x + 48]) { rr(ex, GATE_Y - 18, 8, 32, 3); ctx.fillStyle = '#2f7a18'; ctx.fill(); }
  outlinedText('x' + p.mult, x, GATE_Y - 2, 20, '#ffffff', '#2f6b18');
}
function drawHud() {
  ctx.font = '22px "Lilita One", "Arial Rounded MT Bold", system-ui, sans-serif';
  ctx.textAlign = 'left'; ctx.textBaseline = 'middle'; ctx.fillStyle = '#2b2f55';
  ctx.fillText('LEVEL ' + level, 16, 24);
  const used = slots.filter(Boolean).length, f = used / N;
  ctx.font = '13px "Nunito", system-ui, sans-serif';
  ctx.textAlign = 'right'; ctx.fillStyle = '#4a4f7a';
  ctx.fillText(`BELT ${used}/${N}`, 248, 24);
  rr(256, 18, 84, 12, 6); ctx.fillStyle = 'rgba(43,47,85,.15)'; ctx.fill();
  if (used) { rr(256, 18, Math.max(12, 84 * f), 12, 6); ctx.fillStyle = f > .8 ? '#ff4d61' : f > .6 ? '#ff9f2e' : '#5cc93a'; ctx.fill(); }
  ctx.beginPath(); ctx.arc(374, 24, 15, 0, 7); ctx.fillStyle = '#ffffff'; ctx.fill();
  ctx.strokeStyle = '#2b2f55'; ctx.lineWidth = 2.6; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.arc(374, 24, 7, -Math.PI * .1, Math.PI * 1.55); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(380, 15); ctx.lineTo(381.5, 22.5); ctx.lineTo(374, 22); ctx.stroke();
}
function beltPath() {
  const r = BELT.r, cy = BELT.top + r;
  ctx.beginPath();
  ctx.moveTo(BELT.x1, BELT.top); ctx.lineTo(BELT.x2, BELT.top);
  ctx.arc(BELT.x2, cy, r, -Math.PI / 2, Math.PI / 2);
  ctx.lineTo(BELT.x1, BELT.top + 2 * r);
  ctx.arc(BELT.x1, cy, r, Math.PI / 2, Math.PI * 1.5);
  ctx.closePath();
}
function drawMachine() {
  // funnel wedges
  ctx.fillStyle = '#6170b6';
  ctx.beginPath(); ctx.moveTo(0, 390); ctx.lineTo(8, 392); ctx.lineTo(OUT_X - CH, 446); ctx.lineTo(OUT_X - CH, H); ctx.lineTo(0, H); ctx.fill();
  ctx.beginPath(); ctx.moveTo(W, 390); ctx.lineTo(392, 392); ctx.lineTo(OUT_X + CH, 446); ctx.lineTo(OUT_X + CH, H); ctx.lineTo(W, H); ctx.fill();
  ctx.strokeStyle = '#8795d8'; ctx.lineWidth = 3; ctx.lineJoin = 'round';
  ctx.beginPath(); ctx.moveTo(0, 389); ctx.lineTo(8, 391); ctx.lineTo(OUT_X - CH, 445); ctx.lineTo(OUT_X - CH, 466); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(W, 389); ctx.lineTo(392, 391); ctx.lineTo(OUT_X + CH, 445); ctx.lineTo(OUT_X + CH, 466); ctx.stroke();
  // housing
  rr(14, 466, W - 28, H, 26); ctx.fillStyle = '#56639f'; ctx.fill();
  // belt
  const used = slots.filter(Boolean).length / N;
  const danger = used > .75 && state === 'play' ? (Math.sin(T / 120) * .5 + .5) * (used - .75) * 4 : state === 'over' ? 1 : 0;
  beltPath(); ctx.lineWidth = 36; ctx.strokeStyle = danger ? `rgb(255,${Math.round(245 - 170 * danger)},${Math.round(250 - 160 * danger)})` : '#f3f4fb'; ctx.stroke();
  beltPath(); ctx.lineWidth = 27; ctx.strokeStyle = '#474d6e'; ctx.stroke();
  rr(BELT.x1, BELT.top + 14, BL, 2 * BELT.r - 28, 6); ctx.fillStyle = '#e6e9f7'; ctx.fill();
  const frac = Math.min(1, (T - lastTick) / TICK);
  ctx.fillStyle = '#373c5a';
  for (let k = 0; k < N; k++) { const p = beltPoint((k + frac) * SP); ctx.beginPath(); ctx.arc(p.x, p.y, 7, 0, 7); ctx.fill(); }
  for (let i = 0; i < N; i++) {
    const b = slots[i]; if (!b) continue;
    let p = beltPoint((i + step + frac) * SP);
    const a = (T - b.t0) / ENTER;
    if (a < 1) p = {x: b.fx + (p.x - b.fx) * a, y: b.fy + (p.y - b.fy) * a};
    drawBall(b.c, p.x, p.y);
  }
}
function holePos(col, k) { return {x: COLX[col] - 20 + k * 20, y: TRAY_TOP + 13}; }
function drawCols() {
  for (let j = 0; j < 4; j++) {
    const cx = COLX[j], col = cols[j];
    rr(cx - 38, TRAY_TOP - 8, 76, H, 12); ctx.fillStyle = '#46528c'; ctx.fill();
    const sh = T - col.shiftT0 < SHIFT ? TH * (1 - easeOut((T - col.shiftT0) / SHIFT)) : 0;
    ctx.save(); ctx.beginPath(); ctx.rect(cx - 40, TRAY_TOP - 10, 80, H); ctx.clip();
    for (let i = col.trays.length - 1; i >= 0; i--) {
      const y = TRAY_TOP + i * TH + sh;
      if (y > H) continue;
      const tr = col.trays[i], c = PALETTE[tr.c];
      let p = 0;
      if (i === 0 && col.clearT0 !== null) p = Math.min(1, (T - col.clearT0) / CLEAR);
      ctx.save();
      if (p) { ctx.globalAlpha = 1 - p; ctx.translate(cx, y + 17); ctx.scale(1 + .25 * p, 1 + .25 * p); ctx.translate(-cx, -(y + 17)); }
      rr(cx - 34, y, 68, TH - 3, 8); ctx.fillStyle = shade(c, -.25); ctx.fill();
      rr(cx - 34, y, 68, TH - 7, 8); ctx.fillStyle = c; ctx.fill();
      rr(cx - 34, y, 68, 13, 7); ctx.fillStyle = shade(c, .3); ctx.fill();
      if (i === 0) {
        for (let k = 0; k < CAP; k++) {
          const h = holePos(j, k);
          ctx.fillStyle = shade(c, -.35); ctx.beginPath(); ctx.arc(h.x, h.y + sh, 7.5, 0, 7); ctx.fill();
          if (k < tr.fill) drawBall(tr.c, h.x, h.y + sh, .85);
        }
      }
      ctx.restore();
    }
    ctx.restore();
    if (!col.trays.length) outlinedText('✓', cx, TRAY_TOP + 20, 26, '#ffffff', '#2f3870');
  }
}
function draw() {
  ctx.fillStyle = '#c9cdf0'; ctx.fillRect(0, 0, W, H);
  for (const p of pipes) drawPipe(p);
  ctx.fillStyle = 'rgba(43,47,85,.06)'; ctx.fillRect(0, 0, W, 44);
  drawHud();
  for (const p of pipes) drawGate(p);
  drawMachine();
  for (const b of sink) drawBall(b.c, b.x, b.y);
  drawCols();
  for (const f of flyers) {
    const t = Math.min(1, (T - f.t0) / FLY), h = holePos(f.col, f.hole);
    drawBall(f.c, f.x + (h.x - f.x) * t, f.y + (h.y - f.y) * t - Math.sin(t * Math.PI) * 14, 1 - .15 * t);
  }
  for (const p of parts) {
    const a = 1 - (T - p.t0) / 650;
    ctx.globalAlpha = Math.max(0, a); ctx.fillStyle = PALETTE[p.c];
    ctx.beginPath(); ctx.arc(p.x, p.y, 3 + 2 * a, 0, 7); ctx.fill();
  }
  ctx.globalAlpha = 1;
  if (speed > 1.2 && state === 'play') {
    ctx.globalAlpha = Math.min(1, (speed - 1.2) / 1.5);
    rr(150, 404, 100, 28, 14); ctx.fillStyle = '#ffffff'; ctx.fill();
    ctx.fillStyle = '#2b2f55';
    for (const ox of [166, 176]) { ctx.beginPath(); ctx.moveTo(ox, 411); ctx.lineTo(ox + 9, 418); ctx.lineTo(ox, 425); ctx.fill(); }
    ctx.font = '800 13px "Nunito", system-ui, sans-serif'; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
    ctx.fillText('FINISHING', 190, 418.5);
    ctx.globalAlpha = 1;
  }
  if (hintOn) {
    const b = reduced ? 0 : Math.sin(T / 180) * 4;
    rr(110, 334 + b, 180, 34, 17); ctx.fillStyle = '#ffffff'; ctx.fill();
    ctx.beginPath(); ctx.moveTo(192, 334 + b); ctx.lineTo(200, 324 + b); ctx.lineTo(208, 334 + b); ctx.fill();
    ctx.font = '800 15px "Nunito", system-ui, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillStyle = '#2b2f55'; ctx.fillText('Tap a pipe to pour it', 200, 351 + b);
  }
}

/* ---------- loop & sizing ---------- */
function resize() {
  const st = document.getElementById('stage');
  const s = Math.min(st.clientWidth / W, st.clientHeight / H);
  const dpr = Math.min(devicePixelRatio || 1, 3);
  cv.style.width = W * s + 'px'; cv.style.height = H * s + 'px';
  cv.width = Math.round(W * s * dpr); cv.height = Math.round(H * s * dpr);
  ctx.setTransform(cv.width / W, 0, 0, cv.height / H, 0, 0);
}
addEventListener('resize', resize);
let last = performance.now(), speed = 1;
// Once the pipes and the funnel are empty, the belt holds exactly what the trays need,
// so the level can't be lost: fast-forward to the end.
const finishing = () => state === 'play' && !sink.length && !emitters.length && pipes.every(p => !p.queue.length && !p.anim);
function frame(now) {
  const dt = Math.min(.033, (now - last) / 1000); last = now;
  speed += ((finishing() ? 4 : 1) - speed) * Math.min(1, dt * 2.5);
  if (state !== 'over') update(dt * speed);
  else { T += dt * 1000; for (const p of parts) { p.vy += 600 * dt; p.x += p.vx * dt; p.y += p.vy * dt; } }
  draw();
  requestAnimationFrame(frame);
}
function savedLevel() { try { return parseInt(localStorage.getItem('colorballs.level'), 10) || 1; } catch (e) { return 1; } }
function boot(data) {
  resize();
  startLevel((data && data.level) || savedLevel());
  requestAnimationFrame(frame);
}
const hot = window.claude && window.claude.hot;
if (hot && typeof hot.snapshot === 'function') hot.snapshot(() => ({level}));
if (hot && typeof hot.ready === 'function') hot.ready(boot); else boot((hot && hot.data) || {});
})();
</script>
